  '\bdelivery\b': 15
  '\binfog[eé]rance\b': 15
  '\bsla\b': 10
  '\bkpi\b': 8
  '\bincident\b': 8
  '\bcopil\b': 5
  '\bt[eé]l[eé]com\b': 10
  '\bb2b\b': 8
  '\b(?:xdsl|thd|lte|4g|5g)\b': 5
  '\baws\b': 8
  '\bpython\b': 8
  '\betl\b': 8
  '\bairflow\b': 5
  '\bmongo\b': 5
  '\bmanagement d.[eé]quipe\b': 10
  '\bpmo\b': 8
  '\bgestion de projets?\b': 10
  '\bpilotage\b': 8
  '\bagile\b': 8
  '\bscrum\b': 8
  '\bjira\b': 5
  '\bmoa\b': 8
  '\bmoe\b': 5
  '\broadmap\b': 5
  '\bbacklog\b': 5
  '\bbudget\b': 5
  '\bplanning\b': 5
  '\b(?:prince2|pmp)\b': 5
  '\bsql\b': 8
  '\bspark\b': 5
  '\bkafka\b': 5
  '\b(?:snowflake|dbt)\b': 5
  '\b(?:azure|gcp)\b': 5
