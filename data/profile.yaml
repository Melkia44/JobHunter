# ============================================================================
# PROFIL DE RECHERCHE — le seul fichier à adapter à la personne qui cherche.
# Valeurs livrées = profil d'exemple (SDM / chef de projet IT autour de Nantes) :
# remplace-les par les tiennes. Les accents et la casse n'ont pas d'importance.
# ============================================================================

# Sources lancées par `job-hunter run` (et donc par la CI).
#   jobspy          Indeed + Google Jobs (aucune config)
#   france_travail  API France Travail (FRANCE_TRAVAIL_CLIENT_ID / _SECRET)
#   apec            API APEC (aucune config ; souvent bloquée depuis GitHub, non bloquant)
#   careers_sites   sites carrières des employeurs de data/employers.yaml (careers_url + ats)
#   email_alerts    alertes mail LinkedIn / Hellowork / Indeed (ALERTS_IMAP_USER / _PASSWORD)
# Une source listée mais non configurée remonte 0 offre → run en échec : ne liste que
# celles que tu as configurées.
sources:
  - jobspy
  - france_travail
  - apec
  # - careers_sites
  # - email_alerts

# --- Intitulés visés ---------------------------------------------------------
# Un intitulé d'offre qui CONTIENT l'un d'eux prend son poids (100 par défaut) ;
# sinon score approché (similarité de texte). Sigles ≤ 4 lettres : mot entier.
# gated: true = intitulé ambigu hors IT, plafonné à generic_cap sans marqueur IT
# (« it », « si », « data », « erp »…) — sans effet si filters.it_only est false.
# Forme courte acceptée : « - 'product manager' » (poids 100).
titles:
  - {title: 'service delivery manager'}
  - {title: 'delivery manager'}
  - {title: 'sdm'}
  - {title: 'chef de projet', weight: 75, gated: true}
  - {title: 'responsable operations services'}
  - {title: 'operations services'}
  - {title: 'pmo', weight: 75}
  - {title: 'product manager', weight: 90}
  - {title: 'product owner', weight: 90}
  - {title: 'data engineer', weight: 85}
  - {title: 'chef de projet delivery', weight: 90}
  - {title: 'service delivery'}
  - {title: 'delivery lead', weight: 95}
  - {title: 'service owner', weight: 95}
  - {title: 'service manager', weight: 95, gated: true}
  - {title: 'responsable mco', weight: 95}
  - {title: 'responsable run', weight: 95}
  - {title: 'incident manager', weight: 85}
  - {title: 'problem manager', weight: 80}
  - {title: 'itsm', weight: 85}
  - {title: 'technical account manager', weight: 85}
  - {title: 'responsable de production', weight: 90, gated: true}
  - {title: 'responsable production', weight: 90, gated: true}
  - {title: 'responsable d''exploitation', weight: 90, gated: true}
  - {title: 'responsable exploitation', weight: 90, gated: true}
  - {title: 'contract manager', weight: 80, gated: true}
  - {title: 'customer success manager', weight: 70, gated: true}
  - {title: 'project manager', weight: 75, gated: true}
  - {title: 'responsable operationnel de compte'}
  - {title: 'roc'}
  - {title: 'responsable de contrat', weight: 90, gated: true}
  - {title: 'directeur de contrat', weight: 90, gated: true}

generic_cap: 60

# --- Compétences (regex sur titre + description → points, plafonné à 100) -----
# Garder les guillemets simples : \b = frontière de mot.
hard_skills:
