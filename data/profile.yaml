# --- Zone géographique ---------------------------------------------------------
location:
  center: {city: 'Nantes', insee: '44109', lat: 47.2184, lon: -1.5536}  # insee : code commune (pas le code postal)
  radius_km: 50                      # France Travail et APEC
  home: 'Nort-sur-Erdre'             # lieu → score 100
  core_cities: [Nantes, Saint-Herblain, Rezé, Vertou, Carquefou, Orvault, Saint-Sébastien, Bouguenais, La Chapelle-sur-Erdre]   # → 90
  area_cities: [Ancenis, Clisson, Châteaubriant, Saint-Nazaire, Pornic, Blain, Guérande, Sainte-Luce-sur-Loire, Basse-Goulaine, Treillières, Sautron, Couëron, Bouaye, Thouaré-sur-Loire, Les Sorinières, Sucé-sur-Erdre, Grandchamp, Saint-Jean-de-Boiseau, Haute-Goulaine]   # → 75
  departments: ['44']                # reste du département → 60 ; code postal hors liste → 30
  department_names: [Loire-Atlantique]
  search_departments: ['44', '49', '85', '35']   # filtre des offres APEC / Hellowork (~ rayon)

# --- Requêtes envoyées aux sources ---------------------------------------------
search:
  jobspy_queries:                    # Indeed / Google Jobs, autour de location.center
    - Service Delivery Manager
    - Chef de projet IT
    - Chef de projet digital
    - PMO
    - Product Manager
    - Data Engineer
    - Responsable production informatique
    - Responsable opérationnel de comptes
  apec_keywords:
    - service delivery manager
    - chef de projet informatique
    - PMO
    - product owner
    - data engineer
    - responsable opérationnel de comptes
    - responsable de contrat infogérance
  # Codes métier ROME (https://www.francetravail.fr → fiches métiers ROME)
  france_travail_rome: [M1806, M1802, M1805, M1811, M1810]

# --- Filtres --------------------------------------------------------------------
filters:
  it_only: true    # écarte BTP / industrie / marketing / RH… — false pour un profil non IT
