# Employeurs cibles (optionnel). Deux usages :
#  1. bonus de score « tier » sur toute offre de ces employeurs (P1 = 100, P2 = 80,
#     P3 = 60, hors liste = 50 neutre) ;
#  2. source careers_sites : scraping direct de leur site carrières si careers_url + ats.
# Liste vide = pas de bonus, pas de careers_sites (retire-la de profile.yaml › sources).
#
# ats ∈ {smartrecruiters, teamtailor, greenhouse, lever, cegid, ssr} ; ssr exige
# link_pattern (motif des liens d'offres). Les aliases servent au rapprochement des
# noms (« Renault Group », « Renault SAS » → Renault).
#
# employers:
#   - name: "Exemple SA"
#     tier: 1
#     sector: "Éditeur logiciel"
#     careers_url: "https://careers.smartrecruiters.com/ExempleSA"
#     ats: "smartrecruiters"
#     aliases: ["Exemple"]
#   - name: "Autre Groupe"          # sans careers_url : bonus tier uniquement
#     tier: 2
#     sector: "Industrie"
#     aliases: []
employers: []
