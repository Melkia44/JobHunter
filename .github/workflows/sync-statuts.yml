name: Sync statuts Café Emploi

on:
  schedule:
    # Toutes les heures (minute non ronde). Léger : pas de collecte, ~1 min.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-statuts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv (Python 3.13)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Install deps
        run: uv sync --frozen

      - name: Write service account JSON
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$SA_JSON" > secrets/service_account.json

      - name: Sync
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: uv run job-hunter sync-statuts
