name: Weekly Implantations

on:
  schedule:
    # Lundi 04:47 UTC ≈ 06h47 Paris : digest prêt pour le début de semaine
    - cron: '47 4 * * 1'
  workflow_dispatch:
    inputs:
      since:
        description: "Date de début AAAA-MM-JJ (vide = 60 derniers jours)"
        type: string
        default: ""
      dry_run:
        description: "Test à blanc : affiche les résultats, n'écrit pas le Sheet"
        type: boolean
        default: false

jobs:
  implantations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv (Python 3.13)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Install deps
        run: uv sync --frozen

      - name: Write service account JSON
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$SA_JSON" > secrets/service_account.json

      - name: Run implantations
        shell: bash
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$SINCE" ]; then ARGS+=(--since "$SINCE"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run job-hunter implantations "${ARGS[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
